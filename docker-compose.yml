version: "3.8"

services:
  web:
    build: .
    container_name: sigra-web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      TZ: America/Montevideo
      # El servicio web también necesita las credenciales de la base:
      # config/db.php las lee de getenv() y, si no están, cae a un
      # fallback literal. MYSQL_HOST es el nombre del servicio de la
      # base, que es lo que resuelve dentro de la red de Compose.
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: sigra-db
    restart: unless-stopped
    environment:
      TZ: America/Montevideo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sigra-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db

volumes:
  db-data:
