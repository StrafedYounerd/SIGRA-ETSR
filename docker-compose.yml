version: "3.8"

services:
  web:
    build: .
    container_name: sigra-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: sigra-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cambiar_esta_clave
      MYSQL_DATABASE: sigra_etsr
      MYSQL_USER: sigra_user
      MYSQL_PASSWORD: cambiar_esta_clave_tambien
    volumes:
      - db-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sigra-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db

volumes:
  db-data:
